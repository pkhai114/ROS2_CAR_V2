ekf_filter_node:
  ros__parameters:
    # EKF output rate. Higher than wheel odometry (about 13.25 Hz),
    # but still suitable for the current Mini PC and ROS 2 stack.
    frequency: 30.0

    # Allow short input gaps without immediately declaring a sensor timeout.
    sensor_timeout: 0.2

    # The mobile base operates on a flat floor.
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true
    debug: false

    # EKF is the only source of the dynamic odom -> base_link TF.
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry from the ESP32.
    odom0: /wheel/odom

    # State order:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    #
    # IMPORTANT: Only vx is fused from wheel odometry.
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  false, false,
       false, false, false,
       false, false, false]

    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # IMU orientation and angular velocity.
    imu0: /imu/data

    # Fuse yaw and yaw rate (wz) only.
    imu0_config:
      [false, false, false,
       false, false, true,
       false, false, false,
       false, false, true,
       false, false, false]

    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false

    # No acceleration is fused at this stage, so gravity removal is disabled.
    imu0_remove_gravitational_acceleration: false

    # Keep the filter valid if ROS time jumps backwards during testing.
    reset_on_time_jump: true
