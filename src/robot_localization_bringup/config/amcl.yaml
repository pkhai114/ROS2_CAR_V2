amcl:
  ros__parameters:
    use_sim_time: false

    # TF tree:
    # map --(AMCL)--> odom --(EKF)--> base_link --(static)--> laser
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    tf_broadcast: true
    transform_tolerance: 0.5

    # Use the already-filtered RPLIDAR A1 scan.
    scan_topic: /scan/filtered
    laser_model_type: likelihood_field
    laser_min_range: 0.30
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.20
    lambda_short: 0.10
    z_hit: 0.50
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.40
    do_beamskip: false

    # Differential-drive odometry model.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20

    # Update often enough for the current low-speed mobile base.
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Initial pose will be supplied from RViz with "2D Pose Estimate".
    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.5
    first_map_only: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: map
    frame_id: map

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
    bond_timeout: 4.0
